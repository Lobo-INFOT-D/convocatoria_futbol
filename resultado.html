<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alineación Fútbol Sala — Equilibrado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { background:#f7f7f9; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .jugador-row { display:flex; align-items:center; justify-content:space-between; padding:.5rem; border-bottom:1px solid #e9ecef; gap:.5rem; }
    .jugador-nombre { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .campo { position:relative; width:100%; max-width:1000px; aspect-ratio:2.2/1; margin:1rem auto; background:#2b05b4; border:4px solid #0b5130; border-radius:10px; overflow:hidden; }
    .linea-central { position:absolute; inset:0 auto 0 50%; width:2px; background:rgba(255,255,255,0.5); transform:translateX(-50%); }
    .area { position:absolute; border:2px solid rgba(255,255,255,0.25); width:20%; height:40%; top:30%; border-radius:6px; }
    .area.izq { left:0; } .area.der { right:0; }
    .jugador-campo { position: absolute; min-width: 48px; padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: .95rem; color: #fff; background: rgba(0,0,0,0.25); transform: translate(-50%, -50%); z-index: 10; white-space: nowrap; }
    .equipoA { color:#e90707; background-color: white; }
    .equipoB { color:red; background-color: black; }
    #porteroA { left:8%; top:45%; } #defensaA1 { left:18%; top:25%; } #defensaA2 { left:18%; top:75%; } #alaA { left:32%; top:35%; } #extraA { left:32%; top:55%; }
    #porteroB { right: 1px; top:47%; } #defensaB1 { right:18%; top:25%; } #defensaB2 { right:18%; top:65%; } #alaB { right:32%; top:35%; } #pivotB { right:32%; top:55%; }
    #equipoBlanco { position:absolute; top:5px; left:25%; transform:translateX(-50%); color:red;background-color: #fff; font-weight:700; font-size:1.2rem; border-radius: 5px; padding: 5px;}
    #equipoNegro { position:absolute; top:5px; right:25%; transform:translateX(50%); color:red;background-color: #000; font-weight:700; font-size:1.2rem; border-radius: 5px; padding: 5px;}
  </style>
</head>
<body>
<div class="container py-4">
  <div class="text-center mb-4">
    <h1 class="h3">Convocatoria Futbito</h1>
    <a href="resultado.html" class="btn btn-success mb-3">Ir a Resultados y Notas</a>
    <input type="date" id="fechaInput" class="form-control mx-auto" style="max-width:250px;">
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h2 class="h5">Lista de jugadores</h2>
      <div id="listaJugadores"></div>
      <div class="input-group mt-3">
        <input id="inputNombre" class="form-control" placeholder="Nombre...">
        <button id="btnAddJugador" class="btn btn-primary">Añadir</button>
      </div>
      <div class="d-grid gap-2 mt-3">
        <button id="btnEquilibrar" class="btn btn-warning fw-bold">⚖️ Equilibrar Equipos por Nivel</button>
      </div>
    </div>
  </div>

  <div id="contenedorCampo">
    <div class="campo" id="campo">
      <div class="linea-central"></div><div class="area izq"></div><div class="area der"></div>
      <div id="equipoBlanco">Equipo Blanco</div>
      <div id="porteroA" class="jugador-campo equipoA" data-placeholder="Port A">Port A</div>
      <div id="defensaA1" class="jugador-campo equipoA" data-placeholder="Def A1">Def A1</div>
      <div id="defensaA2" class="jugador-campo equipoA" data-placeholder="Def A2">Def A2</div>
      <div id="alaA" class="jugador-campo equipoA" data-placeholder="Ala A">Ala A</div>
      <div id="extraA" class="jugador-campo equipoA" data-placeholder="Pivot A">Pivot A</div>
      <div id="equipoNegro">Equipo Negro</div>
      <div id="porteroB" class="jugador-campo equipoB" data-placeholder="Port B">Port B</div>
      <div id="defensaB1" class="jugador-campo equipoB" data-placeholder="Def B1">Def B1</div>
      <div id="defensaB2" class="jugador-campo equipoB" data-placeholder="Def B2">Def B2</div>
      <div id="alaB" class="jugador-campo equipoB" data-placeholder="Ala B">Ala B</div>
      <div id="pivotB" class="jugador-campo equipoB" data-placeholder="Pívot B">Pívot B</div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-body">
      <h2 class="h5">Reservas</h2>
      <ul id="listaReservas" class="list-group"></ul>
    </div>
  </div>

  <div class="card shadow-sm mt-4">
    <div class="card-body text-center d-flex gap-2 justify-content-center">
      <button class="btn btn-success" id="btnExport">📸 Exportar</button>
      <button class="btn btn-primary" id="btnAlineacion">💾 Guardar Alineación</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDA_FDkrsAxtBt5_BhRgRkq3NNq3Lt7xdo",
    authDomain: "convocatoria-8c340.firebaseapp.com",
    projectId: "convocatoria-8c340",
    storageBucket: "convocatoria-8c340.firebasestorage.app",
    messagingSenderId: "968350738606",
    appId: "1:968350738606:web:bdff77002fe19077a7a53f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const posiciones = { A: ["porteroA","defensaA1","defensaA2","alaA","extraA"], B: ["porteroB","defensaB1","defensaB2","alaB","pivotB"] };
  let jugadoresBD = [];

  // CARGAR JUGADORES
  async function cargarJugadores() {
    const snapshot = await getDocs(collection(db, "jugadores"));
    jugadoresBD = snapshot.docs.map(d => ({ id: d.id, nombre: d.data().nombre }));
    renderLista();
  }

  function renderLista() {
    const cont = document.getElementById("listaJugadores");
    cont.innerHTML = "";
    jugadoresBD.forEach(j => {
      const div = document.createElement("div");
      div.className = "jugador-row";
      div.innerHTML = `
        <div class="jugador-nombre">${j.nombre}</div>
        <div class="btn-group">
          <input type="radio" class="btn-check" name="rol-${j.id}" id="tit-${j.id}" value="titular">
          <label class="btn btn-outline-success" for="tit-${j.id}">Tit</label>
          <input type="radio" class="btn-check" name="rol-${j.id}" id="res-${j.id}" value="reserva">
          <label class="btn btn-outline-secondary" for="res-${j.id}">Res</label>
        </div>
        <div class="btn-group">
          <input type="radio" class="btn-check" name="equipo-${j.id}" id="eqA-${j.id}" value="A">
          <label class="btn btn-outline-dark" for="eqA-${j.id}">Blanco</label>
          <input type="radio" class="btn-check" name="equipo-${j.id}" id="eqB-${j.id}" value="B">
          <label class="btn btn-outline-dark" for="eqB-${j.id}">Negro</label>
        </div>
        <button class="btn btn-sm" onclick="resetJugador('${j.id}','${j.nombre}')">🔄</button>
      `;
      div.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => actualizarCampo(j)));
      cont.appendChild(div);
    });
  }

  // EQUILIBRIO POR NOTAS
  async function equilibrarEquipos() {
    const snap = await getDocs(collection(db, "alineaciones"));
    let historial = {};
    snap.forEach(d => {
      const p = d.data().puntuaciones;
      if (p) Object.entries(p).forEach(([n, nota]) => {
        if (!historial[n]) historial[n] = [];
        historial[n].push(nota);
      });
    });

    let seleccionados = [];
    jugadoresBD.forEach(j => {
      if (document.getElementById(`tit-${j.id}`).checked) {
        const notas = historial[j.nombre] || [];
        const media = notas.length ? notas.reduce((a,b)=>a+b,0)/notas.length : 5;
        seleccionados.push({ ...j, nivel: media });
      }
    });

    if (seleccionados.length !== 10) return alert("Selecciona 10 titulares.");
    seleccionados.sort((a,b) => b.nivel - a.nivel);
    
    seleccionados.forEach((j, i) => {
      const eq = [0, 3, 4, 7, 8].includes(i) ? "A" : "B";
      document.getElementById(`eq${eq}-${j.id}`).checked = true;
      actualizarCampo(j);
    });
    alert("Equilibrado con éxito");
  }

  function actualizarCampo(j) {
    const rol = document.querySelector(`input[name="rol-${j.id}"]:checked`)?.value;
    const equipo = document.querySelector(`input[name="equipo-${j.id}"]:checked`)?.value;
    quitarDelCampo(j.nombre);
    if (rol === "titular" && equipo) {
      const pos = posiciones[equipo].find(p => document.getElementById(p).textContent === document.getElementById(p).dataset.placeholder);
      if (pos) document.getElementById(pos).textContent = j.nombre;
    }
  }

  function quitarDelCampo(n) { [...posiciones.A, ...posiciones.B].forEach(p => { const el = document.getElementById(p); if(el.textContent === n) el.textContent = el.dataset.placeholder; }); }
  
  window.resetJugador = (id, n) => { 
    document.querySelectorAll(`input[name="rol-${id}"], input[name="equipo-${id}"]`).forEach(r => r.checked = false); 
    quitarDelCampo(n); 
  };

  document.getElementById("btnEquilibrar").addEventListener("click", equilibrarEquipos);
  document.getElementById("btnAddJugador").addEventListener("click", async () => {
    const n = document.getElementById("inputNombre").value;
    if(n) await addDoc(collection(db, "jugadores"), { nombre: n });
    cargarJugadores();
  });
  document.getElementById("btnAlineacion").addEventListener("click", async () => {
    const f = document.getElementById("fechaInput").value;
    if(!f) return alert("Pon una fecha");
    const titA = posiciones.A.map(p => document.getElementById(p).textContent).filter(t => t.length < 15);
    const titB = posiciones.B.map(p => document.getElementById(p).textContent).filter(t => t.length < 15);
    await setDoc(doc(db, "alineaciones", f), { TitularesA: titA, TitularesB: titB, fecha: f }, { merge: true });
    alert("Guardado");
  });

  cargarJugadores();
</script>
</body>
</html>
