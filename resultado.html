<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resultados y Valoraciones</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body { background:#f7f7f9; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    
    .rating-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }
    .rating-input {
      width: 60px;
      text-align: center;
    }
    /* Colores equipos */
    .titular-blanco { border-left: 4px solid #ccc; padding-left: 8px; }
    .titular-negro { border-left: 4px solid #111; padding-left: 8px; }
  </style>
</head>
<body>

<div class="container py-4" style="max-width: 600px;">

  <div class="text-center mb-4">
    <h1 class="h3">Resultados y Notas</h1>
    <p class="text-muted">Gestiona los partidos jugados</p>
    <a href="index.html" class="btn btn-outline-primary btn-sm">
      ← Volver a Alineaciones
    </a>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">1. Guardar Resultado</h5>
    </div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-6">
          <label class="form-label small">📅 Fecha</label>
          <input type="date" id="fechaInput" class="form-control">
        </div>
        <div class="col-6">
          <label class="form-label small">⚽ Marcador</label>
          <input type="text" id="resultadoInput" class="form-control" placeholder="Ej: 5-4">
        </div>
      </div>
      <button id="guardarBtn" class="btn btn-primary w-100 mt-3">💾 Guardar Resultado</button>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">2. Puntuar Jugadores (1-10)</h5>
    </div>
    <div class="card-body">
      <p class="small text-muted">Selecciona la fecha del partido para cargar la alineación y poner notas.</p>
      
      <div class="input-group mb-3">
        <input type="date" id="fechaValoracion" class="form-control">
        <button id="btnCargarParaValorar" class="btn btn-secondary">Cargar Jugadores</button>
      </div>

      <div id="panelValoracion" style="display:none;">
        <h6 class="mt-3 text-muted">⚪ Equipo Blanco (A)</h6>
        <div id="listaValoracionA" class="mb-3"></div>

        <h6 class="mt-3 text-muted">⚫ Equipo Negro (B)</h6>
        <div id="listaValoracionB" class="mb-3"></div>

        <button id="btnGuardarNotas" class="btn btn-success w-100 mt-2">💾 Guardar Notas</button>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0">3. Historial</h5>
    </div>
    <div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="small">Desde</label>
          <input type="date" id="fechaInicio" class="form-control">
        </div>
        <div class="col-6">
          <label class="small">Hasta</label>
          <input type="date" id="fechaFin" class="form-control">
        </div>
      </div>
      <button id="historialBtn" class="btn btn-info w-100 text-white">📜 Ver Historial</button>
      
      <div id="historial" class="mt-4"></div>
    </div>
  </div>

</div>

<script type="module">
  // Usamos la versión 12.6.0 para coincidir con tu index.html
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { 
    getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc 
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDA_FDkrsAxtBt5_BhRgRkq3NNq3Lt7xdo",
    authDomain: "convocatoria-8c340.firebaseapp.com",
    projectId: "convocatoria-8c340",
    storageBucket: "convocatoria-8c340.firebasestorage.app",
    messagingSenderId: "968350738606",
    appId: "1:968350738606:web:bdff77002fe19077a7a53f",
    measurementId: "G-ZV9MG4T1FF"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // -------------------------------------------------------
  // 1. GUARDAR RESULTADO
  // -------------------------------------------------------
  async function guardarResultado() {
    const fecha = document.getElementById("fechaInput").value;
    const resultado = document.getElementById("resultadoInput").value.trim();

    if (!fecha || !resultado) {
      alert("Por favor, introduce fecha y resultado.");
      return;
    }

    try {
      // Guardamos en colección 'resultados'
      const docRef = doc(db, "resultados", fecha);
      await setDoc(docRef, {
        resultado: resultado,
        fecha: fecha
      });
      
      // Opcional: También actualizamos el documento de 'alineaciones' si existe, para tenerlo todo junto
      const alineacionRef = doc(db, "alineaciones", fecha);
      const alineacionSnap = await getDoc(alineacionRef);
      if(alineacionSnap.exists()) {
        await setDoc(alineacionRef, { resultado: resultado }, { merge: true });
      }

      alert("✅ Resultado guardado correctamente.");
    } catch (e) {
      console.error("Error al guardar: ", e);
      alert("❌ Error al guardar.");
    }
  }

  // -------------------------------------------------------
  // 2. VALORAR JUGADORES (NUEVO)
  // -------------------------------------------------------
  const panelValoracion = document.getElementById("panelValoracion");
  const listaA = document.getElementById("listaValoracionA");
  const listaB = document.getElementById("listaValoracionB");
  let jugadoresParaValorar = []; // Cache temporal

  async function cargarAlineacionParaValorar() {
    const fecha = document.getElementById("fechaValoracion").value;
    if (!fecha) return alert("Selecciona una fecha.");

    try {
      const docRef = doc(db, "alineaciones", fecha);
      const snap = await getDoc(docRef);

      if (!snap.exists()) {
        alert("❌ No hay alineación guardada para esa fecha.");
        panelValoracion.style.display = "none";
        return;
      }

      const data = snap.data();
      const titularesA = data.TitularesA || [];
      const titularesB = data.TitularesB || [];
      const notasPrevias = data.puntuaciones || {}; // Si ya existen notas guardadas

      listaA.innerHTML = "";
      listaB.innerHTML = "";

      // Función auxiliar para crear la fila HTML
      const crearFila = (nombre, equipoClass) => {
        const div = document.createElement("div");
        div.className = `rating-row ${equipoClass}`;
        // Buscamos si ya tenía nota, si no, vacío
        const notaGuardada = notasPrevias[nombre] || ""; 
        
        div.innerHTML = `
          <span>${nombre}</span>
          <input type="number" min="1" max="10" 
                 class="form-control rating-input input-nota" 
                 data-nombre="${nombre}" 
                 placeholder="-" value="${notaGuardada}">
        `;
        return div;
      };

      if(titularesA.length === 0 && titularesB.length === 0) {
        alert("La alineación está vacía.");
        return;
      }

      titularesA.forEach(nombre => listaA.appendChild(crearFila(nombre, "titular-blanco")));
      titularesB.forEach(nombre => listaB.appendChild(crearFila(nombre, "titular-negro")));

      panelValoracion.style.display = "block";

    } catch (e) {
      console.error(e);
      alert("Error cargando alineación.");
    }
  }

  async function guardarNotas() {
    const fecha = document.getElementById("fechaValoracion").value;
    const inputs = document.querySelectorAll(".input-nota");
    
    // Construimos el objeto mapa: { "Juan": 8, "Pedro": 5 }
    let puntuacionesObj = {};

    inputs.forEach(inp => {
      const val = inp.value;
      const nombre = inp.dataset.nombre;
      if (val) {
        puntuacionesObj[nombre] = parseInt(val);
      }
    });

    try {
      const docRef = doc(db, "alineaciones", fecha);
      // Usamos setDoc con merge para no borrar lo que ya existe (titulares, etc)
      await setDoc(docRef, { 
        puntuaciones: puntuacionesObj 
      }, { merge: true });

      alert("✅ ¡Notas guardadas correctamente!");
    } catch (e) {
      console.error(e);
      alert("❌ Error guardando notas.");
    }
  }

  // -------------------------------------------------------
  // 3. HISTORIAL
  // -------------------------------------------------------
  async function mostrarHistorialPorRango() {
    const fechaInicio = document.getElementById("fechaInicio").value;
    const fechaFin = document.getElementById("fechaFin").value;
    const historialDiv = document.getElementById("historial");

    if (!fechaInicio || !fechaFin) {
      alert("Selecciona fecha inicio y fin.");
      return;
    }

    historialDiv.innerHTML = "<div class='text-center spinner-border text-primary'></div>";

    try {
      // Obtenemos alineaciones (que ahora pueden contener resultado y notas)
      const alineacionesSnap = await getDocs(collection(db, "alineaciones"));
      
      // Creamos un array filtrado
      let partidos = [];
      alineacionesSnap.forEach(docSnap => {
        const d = docSnap.data();
        // Filtrar por rango
        if (d.fecha >= fechaInicio && d.fecha <= fechaFin) {
          partidos.push(d);
        }
      });

      // Ordenar por fecha descendente
      partidos.sort((a, b) => b.fecha.localeCompare(a.fecha));

      historialDiv.innerHTML = "";

      if (partidos.length === 0) {
        historialDiv.innerHTML = "<p class='text-center text-muted'>No hay partidos en ese rango.</p>";
        return;
      }

      partidos.forEach(p => {
        // Formatear puntuaciones para mostrar
        let htmlNotas = "";
        if (p.puntuaciones) {
            htmlNotas = "<div class='mt-2 p-2 bg-light border rounded small'><strong>⭐ Puntuaciones:</strong><br>";
            // Ordenar por nota (opcional) o mostrar tal cual
            for (const [nombre, nota] of Object.entries(p.puntuaciones)) {
                htmlNotas += `<span class="badge bg-secondary me-1" style="font-weight:normal;">${nombre}: ${nota}</span> `;
            }
            htmlNotas += "</div>";
        }

        const card = document.createElement("div");
        card.className = "card mb-3";
        card.innerHTML = `
          <div class="card-body">
            <h5 class="card-title d-flex justify-content-between">
                <span>📅 ${p.fecha}</span>
                <span class="badge bg-dark">${p.resultado || "Sin resultado"}</span>
            </h5>
            <hr>
            <div class="row">
                <div class="col-6 border-end">
                    <strong class="text-secondary">⚪ Blanco</strong><br>
                    ${p.TitularesA ? p.TitularesA.join("<br>") : "-"}
                </div>
                <div class="col-6">
                    <strong class="text-secondary">⚫ Negro</strong><br>
                    ${p.TitularesB ? p.TitularesB.join("<br>") : "-"}
                </div>
            </div>
            ${htmlNotas}
          </div>
        `;
        historialDiv.appendChild(card);
      });

    } catch (e) {
      console.error("Error historial:", e);
      historialDiv.innerHTML = "<p class='text-danger'>Error cargando historial.</p>";
    }
  }

  // Asignar eventos
  document.getElementById("guardarBtn").addEventListener("click", guardarResultado);
  document.getElementById("btnCargarParaValorar").addEventListener("click", cargarAlineacionParaValorar);
  document.getElementById("btnGuardarNotas").addEventListener("click", guardarNotas);
  document.getElementById("historialBtn").addEventListener("click", mostrarHistorialPorRango);

</script>
</body>
</html>
